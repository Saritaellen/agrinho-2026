<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroClima Inteligente</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>🌾 AgroClima Inteligente</h1>
    <p>Tecnologia ajudando o produtor rural a tomar decisões melhores</p>
  </header>

  <section class="card">
    <h2>🌦️ Previsão Simulada</h2>

    <input type="text" id="cidade" placeholder="Digite sua cidade">
    <button onclick="gerarClima()">Ver clima</button>

    <p id="resultadoClima"></p>
  </section>

  <section class="card">
    <h2>🌱 Melhor época de plantio</h2>

    <button onclick="dicaPlantio('soja')">Soja</button>
    <button onclick="dicaPlantio('milho')">Milho</button>

    <p id="dica"></p>
  </section>

  <section class="card">
    <h2>📊 Calculadora de produção</h2>

    <input type="number" id="hectares" placeholder="Hectares plantados">
    <button onclick="calcularProducao()">Calcular produção</button>

    <p id="resultadoProducao"></p>
  </section>

  <section class="card alerta">
    <h2>⚠️ Alerta do sistema</h2>
    <p id="alerta">Nenhum alerta no momento.</p>
  </section>

  <footer>
    <p>Projeto Agrinho 2026 - Agricultura + Tecnologia</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
